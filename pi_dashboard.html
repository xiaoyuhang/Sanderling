<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE Online 行星开发状态监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c1445 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00d4ff;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.8;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #00d4ff;
        }

        .status-indicator {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active {
            background: #4CAF50;
            color: white;
        }

        .status-inactive {
            background: #757575;
            color: white;
        }

        .status-attention {
            background: #FF9800;
            color: white;
            animation: pulse 2s infinite;
        }

        .status-error {
            background: #F44336;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .resource-bar {
            margin: 10px 0;
        }

        .resource-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-power {
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
        }

        .progress-cpu {
            background: linear-gradient(90deg, #2196F3, #03DAC6);
        }

        .progress-storage {
            background: linear-gradient(90deg, #FF9800, #FFC107);
        }

        .facility-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .facility-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .facility-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .facility-name {
            font-size: 0.9em;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .facility-status {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .extractor-info {
            background: rgba(0, 212, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #00d4ff;
        }

        .extractor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .resource-type {
            font-weight: bold;
            color: #00d4ff;
        }

        .extraction-rate {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .cycle-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .planet-map {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            min-height: 200px;
            position: relative;
            overflow: hidden;
        }

        .planet-surface {
            width: 100%;
            height: 180px;
            background: radial-gradient(circle at 30% 30%, #4a5568, #2d3748);
            border-radius: 50%;
            position: relative;
            margin: 0 auto;
        }

        .facility-marker {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #00d4ff;
            background: rgba(0, 212, 255, 0.8);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .facility-marker:hover {
            transform: scale(1.5);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.8);
        }

        .facility-marker.command-center {
            background: #4CAF50;
            border-color: #4CAF50;
            width: 16px;
            height: 16px;
        }

        .facility-marker.extractor {
            background: #FF9800;
            border-color: #FF9800;
        }

        .facility-marker.processor {
            background: #2196F3;
            border-color: #2196F3;
        }

        .facility-marker.storage {
            background: #9C27B0;
            border-color: #9C27B0;
        }

        .connection-line {
            position: absolute;
            height: 2px;
            background: rgba(0, 212, 255, 0.5);
            transform-origin: left center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            opacity: 0.7;
        }

        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #F44336;
            color: #ffcdd2;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                justify-content: center;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌍 EVE Online 行星开发监控</h1>
        <p>实时监控您的行星殖民地状态和资源开采情况</p>
    </div>

    <div class="container">
        <div class="controls">
            <button class="btn" onclick="refreshData()">🔄 刷新数据</button>
            <button class="btn" onclick="toggleAutoRefresh()">⏱️ 自动刷新</button>
            <button class="btn" onclick="exportData()">📊 导出数据</button>
            <button class="btn" onclick="showSettings()">⚙️ 设置</button>
        </div>

        <div class="summary-stats">
            <div class="stat-card">
                <div class="stat-number" id="totalColonies">0</div>
                <div class="stat-label">活跃殖民地</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalExtractors">0</div>
                <div class="stat-label">提取器</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalProduction">0</div>
                <div class="stat-label">每小时产量</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="needsAttention">0</div>
                <div class="stat-label">需要关注</div>
            </div>
        </div>

        <div id="dashboardContent" class="dashboard-grid">
            <!-- 动态内容将在这里生成 -->
        </div>

        <div id="loadingIndicator" class="loading">
            🔄 正在加载行星开发数据...
        </div>
    </div>

    <script>
        // 模拟数据 - 在实际应用中，这些数据将来自Sanderling的内存读取
        const mockPlanetaryData = {
            colonies: [
                {
                    planetName: "Jita IV - Moon 4",
                    planetType: "Temperate",
                    status: "active",
                    powerUsage: { used: 1500, total: 2000 },
                    cpuUsage: { used: 750, total: 1000 },
                    facilities: [
                        { type: "Command Center", status: "active", level: 3 },
                        { type: "Extractor", status: "active", resource: "Base Metals" },
                        { type: "Processor", status: "active", schematic: "Refined Metals" },
                        { type: "Storage Unit", status: "full", capacity: 5000, used: 4800 },
                        { type: "Launchpad", status: "active", capacity: 10000, used: 2500 }
                    ],
                    extractors: [
                        {
                            resourceType: "Base Metals",
                            extractionRate: 2500.5,
                            cycleTime: 24,
                            isActive: true,
                            heads: 5,
                            efficiency: 85
                        }
                    ],
                    position: { x: 150, y: 80 }
                },
                {
                    planetName: "Dodixie IX - Moon 20",
                    planetType: "Barren",
                    status: "attention",
                    powerUsage: { used: 1800, total: 2000 },
                    cpuUsage: { used: 950, total: 1000 },
                    facilities: [
                        { type: "Command Center", status: "active", level: 4 },
                        { type: "Extractor", status: "inactive", resource: "Heavy Metals" },
                        { type: "Processor", status: "error", schematic: "Toxic Metals" },
                        { type: "Storage Unit", status: "active", capacity: 8000, used: 3200 }
                    ],
                    extractors: [
                        {
                            resourceType: "Heavy Metals",
                            extractionRate: 0,
                            cycleTime: 0,
                            isActive: false,
                            heads: 3,
                            efficiency: 0
                        }
                    ],
                    position: { x: 300, y: 120 }
                },
                {
                    planetName: "Amarr VIII (Oris)",
                    planetType: "Oceanic",
                    status: "active",
                    powerUsage: { used: 1200, total: 1500 },
                    cpuUsage: { used: 600, total: 800 },
                    facilities: [
                        { type: "Command Center", status: "active", level: 2 },
                        { type: "Extractor", status: "active", resource: "Aqueous Liquids" },
                        { type: "Processor", status: "active", schematic: "Water" },
                        { type: "Launchpad", status: "active", capacity: 10000, used: 1500 }
                    ],
                    extractors: [
                        {
                            resourceType: "Aqueous Liquids",
                            extractionRate: 3200.8,
                            cycleTime: 18,
                            isActive: true,
                            heads: 4,
                            efficiency: 92
                        }
                    ],
                    position: { x: 450, y: 90 }
                }
            ]
        };

        let autoRefreshInterval = null;
        let isAutoRefreshEnabled = false;

        // 初始化页面
        function initializeDashboard() {
            updateSummaryStats();
            renderColonies();
            hideLoading();
        }

        // 更新汇总统计
        function updateSummaryStats() {
            const data = mockPlanetaryData;
            const activeColonies = data.colonies.filter(c => c.status === 'active').length;
            const totalExtractors = data.colonies.reduce((sum, c) => sum + c.extractors.length, 0);
            const totalProduction = data.colonies.reduce((sum, c) => 
                sum + c.extractors.reduce((extractorSum, e) => extractorSum + e.extractionRate, 0), 0
            );
            const needsAttention = data.colonies.filter(c => c.status === 'attention' || c.status === 'error').length;

            document.getElementById('totalColonies').textContent = activeColonies;
            document.getElementById('totalExtractors').textContent = totalExtractors;
            document.getElementById('totalProduction').textContent = Math.round(totalProduction);
            document.getElementById('needsAttention').textContent = needsAttention;
        }

        // 渲染殖民地卡片
        function renderColonies() {
            const container = document.getElementById('dashboardContent');
            container.innerHTML = '';

            mockPlanetaryData.colonies.forEach((colony, index) => {
                const colonyCard = createColonyCard(colony, index);
                container.appendChild(colonyCard);
            });
        }

        // 创建殖民地卡片
        function createColonyCard(colony, index) {
            const card = document.createElement('div');
            card.className = 'card';
            
            const statusClass = getStatusClass(colony.status);
            const statusText = getStatusText(colony.status);
            
            const powerPercentage = (colony.powerUsage.used / colony.powerUsage.total) * 100;
            const cpuPercentage = (colony.cpuUsage.used / colony.cpuUsage.total) * 100;

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${colony.planetName}</div>
                    <div class="status-indicator ${statusClass}">${statusText}</div>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <strong>行星类型:</strong> ${colony.planetType}
                </div>

                <div class="resource-bar">
                    <div class="resource-label">
                        <span>电力使用</span>
                        <span>${colony.powerUsage.used} / ${colony.powerUsage.total} MW</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill progress-power" style="width: ${powerPercentage}%"></div>
                    </div>
                </div>

                <div class="resource-bar">
                    <div class="resource-label">
                        <span>CPU使用</span>
                        <span>${colony.cpuUsage.used} / ${colony.cpuUsage.total} tf</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill progress-cpu" style="width: ${cpuPercentage}%"></div>
                    </div>
                </div>

                <div class="facility-grid">
                    ${colony.facilities.map(facility => `
                        <div class="facility-item">
                            <div class="facility-icon">${getFacilityIcon(facility.type)}</div>
                            <div class="facility-name">${facility.type}</div>
                            <div class="facility-status">${facility.status}</div>
                        </div>
                    `).join('')}
                </div>

                ${colony.extractors.map(extractor => `
                    <div class="extractor-info">
                        <div class="extractor-header">
                            <div class="resource-type">${extractor.resourceType}</div>
                            <div class="status-indicator ${extractor.isActive ? 'status-active' : 'status-inactive'}">
                                ${extractor.isActive ? '运行中' : '停止'}
                            </div>
                        </div>
                        <div class="extraction-rate">
                            提取速率: ${extractor.extractionRate.toFixed(1)} 单位/小时
                        </div>
                        <div class="cycle-info">
                            <span>周期时间: ${extractor.cycleTime}小时</span>
                            <span>效率: ${extractor.efficiency}%</span>
                            <span>提取头: ${extractor.heads}</span>
                        </div>
                    </div>
                `).join('')}

                <div class="planet-map">
                    <div class="planet-surface" id="planet-${index}">
                        <!-- 设施标记将通过JavaScript添加 -->
                    </div>
                </div>
            `;

            // 添加设施标记到行星地图
            setTimeout(() => {
                addFacilityMarkers(index, colony.facilities);
            }, 100);

            return card;
        }

        // 添加设施标记到行星地图
        function addFacilityMarkers(planetIndex, facilities) {
            const planetSurface = document.getElementById(`planet-${planetIndex}`);
            if (!planetSurface) return;

            facilities.forEach((facility, facilityIndex) => {
                const marker = document.createElement('div');
                marker.className = `facility-marker ${facility.type.toLowerCase().replace(' ', '-')}`;
                
                // 随机位置（在实际应用中，这些位置将来自游戏数据）
                const angle = (facilityIndex / facilities.length) * 2 * Math.PI;
                const radius = 60 + Math.random() * 30;
                const x = 50 + Math.cos(angle) * radius;
                const y = 50 + Math.sin(angle) * radius;
                
                marker.style.left = `${x}%`;
                marker.style.top = `${y}%`;
                marker.title = `${facility.type} - ${facility.status}`;
                
                planetSurface.appendChild(marker);
            });
        }

        // 获取状态样式类
        function getStatusClass(status) {
            switch (status) {
                case 'active': return 'status-active';
                case 'inactive': return 'status-inactive';
                case 'attention': return 'status-attention';
                case 'error': return 'status-error';
                default: return 'status-inactive';
            }
        }

        // 获取状态文本
        function getStatusText(status) {
            switch (status) {
                case 'active': return '正常运行';
                case 'inactive': return '未激活';
                case 'attention': return '需要关注';
                case 'error': return '错误';
                default: return '未知';
            }
        }

        // 获取设施图标
        function getFacilityIcon(facilityType) {
            switch (facilityType) {
                case 'Command Center': return '🏢';
                case 'Extractor': return '⛏️';
                case 'Processor': return '🏭';
                case 'Storage Unit': return '📦';
                case 'Launchpad': return '🚀';
                default: return '🔧';
            }
        }

        // 隐藏加载指示器
        function hideLoading() {
            document.getElementById('loadingIndicator').style.display = 'none';
        }

        // 显示加载指示器
        function showLoading() {
            document.getElementById('loadingIndicator').style.display = 'block';
        }

        // 刷新数据
        function refreshData() {
            showLoading();
            // 模拟API调用延迟
            setTimeout(() => {
                // 在实际应用中，这里会调用Sanderling API获取最新数据
                updateSummaryStats();
                renderColonies();
                hideLoading();
            }, 1000);
        }

        // 切换自动刷新
        function toggleAutoRefresh() {
            if (isAutoRefreshEnabled) {
                clearInterval(autoRefreshInterval);
                isAutoRefreshEnabled = false;
                alert('自动刷新已关闭');
            } else {
                autoRefreshInterval = setInterval(refreshData, 30000); // 每30秒刷新
                isAutoRefreshEnabled = true;
                alert('自动刷新已开启（每30秒）');
            }
        }

        // 导出数据
        function exportData() {
            const dataStr = JSON.stringify(mockPlanetaryData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'planetary_interaction_data.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        // 显示设置
        function showSettings() {
            alert('设置功能开发中...\n\n可配置项目：\n- 刷新间隔\n- 警报阈值\n- 显示选项\n- 数据源设置');
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializeDashboard);

        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
