<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE Online 行星开发状态监控 - 实时版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c1445 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00d4ff;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.8;
        }

        .connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .connection-online {
            background: #4CAF50;
            color: white;
        }

        .connection-offline {
            background: #F44336;
            color: white;
            animation: pulse 2s infinite;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card-title {
            font-size: 1.4em;
            font-weight: bold;
            color: #00d4ff;
        }

        .status-indicator {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-active {
            background: #4CAF50;
            color: white;
        }

        .status-inactive {
            background: #757575;
            color: white;
        }

        .status-attention {
            background: #FF9800;
            color: white;
            animation: pulse 2s infinite;
        }

        .status-error {
            background: #F44336;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .resource-bar {
            margin: 10px 0;
        }

        .resource-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .progress-power {
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
        }

        .progress-cpu {
            background: linear-gradient(90deg, #2196F3, #03DAC6);
        }

        .progress-storage {
            background: linear-gradient(90deg, #FF9800, #FFC107);
        }

        .facility-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .facility-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .facility-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .facility-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .facility-name {
            font-size: 0.9em;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .facility-status {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .extractor-info {
            background: rgba(0, 212, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #00d4ff;
        }

        .extractor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .resource-type {
            font-weight: bold;
            color: #00d4ff;
        }

        .extraction-rate {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .cycle-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            position: relative;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .alerts-panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .alerts-header {
            font-size: 1.4em;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-warning {
            border-left-color: #FF9800;
        }

        .alert-info {
            border-left-color: #2196F3;
        }

        .alert-error {
            border-left-color: #F44336;
        }

        .alert-message {
            flex: 1;
        }

        .alert-time {
            font-size: 0.8em;
            opacity: 0.7;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            opacity: 0.7;
        }

        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #F44336;
            color: #ffcdd2;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .last-update {
            font-size: 0.8em;
            opacity: 0.6;
            text-align: right;
            margin-top: 10px;
        }

        .performance-info {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .performance-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            margin: 5% auto;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #00d4ff;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                justify-content: center;
            }
            
            .header h1 {
                font-size: 2em;
            }

            .connection-status {
                position: static;
                margin-top: 10px;
                display: inline-block;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌍 EVE Online 行星开发监控</h1>
        <p>实时监控您的行星殖民地状态和资源开采情况</p>
        <div id="connectionStatus" class="connection-status connection-offline">🔴 离线</div>
    </div>

    <div class="container">
        <div class="controls">
            <button class="btn" onclick="refreshData()" id="refreshBtn">🔄 刷新数据</button>
            <button class="btn" onclick="toggleAutoRefresh()" id="autoRefreshBtn">⏱️ 自动刷新</button>
            <button class="btn" onclick="showResourcesModal()">📊 资源详情</button>
            <button class="btn" onclick="exportData()">💾 导出数据</button>
            <button class="btn" onclick="showSettings()">⚙️ 设置</button>
        </div>

        <div id="alertsPanel" class="alerts-panel" style="display: none;">
            <div class="alerts-header">
                🚨 警报和通知
            </div>
            <div id="alertsList"></div>
        </div>

        <div class="summary-stats">
            <div class="stat-card">
                <div class="stat-number" id="totalColonies">-</div>
                <div class="stat-label">总殖民地</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeColonies">-</div>
                <div class="stat-label">活跃殖民地</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalExtractors">-</div>
                <div class="stat-label">提取器</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalProduction">-</div>
                <div class="stat-label">每小时产量</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="needsAttention">-</div>
                <div class="stat-label">需要关注</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="averageEfficiency">-</div>
                <div class="stat-label">平均效率 %</div>
            </div>
        </div>

        <div id="dashboardContent" class="dashboard-grid">
            <!-- 动态内容将在这里生成 -->
        </div>

        <div id="loadingIndicator" class="loading">
            🔄 正在加载行星开发数据...
        </div>

        <div class="performance-info">
            <div class="performance-item">
                <span>数据新鲜度:</span>
                <span id="dataFreshness">-</span>
            </div>
            <div class="performance-item">
                <span>最后扫描:</span>
                <span id="lastScanTime">-</span>
            </div>
            <div class="performance-item">
                <span>扫描耗时:</span>
                <span id="scanDuration">-</span>
            </div>
            <div class="performance-item">
                <span>内存读取状态:</span>
                <span id="memoryReadingStatus">-</span>
            </div>
        </div>
    </div>

    <!-- 资源详情模态框 -->
    <div id="resourcesModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeResourcesModal()">&times;</span>
            <h2 style="color: #00d4ff; margin-bottom: 20px;">📊 资源详情</h2>
            <div id="resourcesContent"></div>
        </div>
    </div>

    <!-- 殖民地详情模态框 -->
    <div id="colonyModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeColonyModal()">&times;</span>
            <h2 id="colonyModalTitle" style="color: #00d4ff; margin-bottom: 20px;"></h2>
            <div id="colonyModalContent"></div>
        </div>
    </div>

    <script>
        // API配置
        const API_BASE_URL = 'http://localhost:12001/api/pi';
        
        // 全局状态
        let autoRefreshInterval = null;
        let isAutoRefreshEnabled = false;
        let lastDataUpdate = null;
        let connectionStatus = false;

        // 初始化页面
        async function initializeDashboard() {
            await refreshData();
            checkConnection();
            setInterval(checkConnection, 5000); // 每5秒检查连接状态
        }

        // 检查连接状态
        async function checkConnection() {
            try {
                const response = await fetch(`${API_BASE_URL}/status`);
                if (response.ok) {
                    setConnectionStatus(true);
                } else {
                    setConnectionStatus(false);
                }
            } catch (error) {
                setConnectionStatus(false);
            }
        }

        // 设置连接状态
        function setConnectionStatus(isOnline) {
            const statusElement = document.getElementById('connectionStatus');
            if (isOnline !== connectionStatus) {
                connectionStatus = isOnline;
                if (isOnline) {
                    statusElement.className = 'connection-status connection-online';
                    statusElement.textContent = '🟢 在线';
                } else {
                    statusElement.className = 'connection-status connection-offline';
                    statusElement.textContent = '🔴 离线';
                }
            }
        }

        // 刷新数据
        async function refreshData() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;
            refreshBtn.textContent = '🔄 刷新中...';
            
            showLoading();
            
            try {
                // 并行获取所有数据
                const [statusResponse, coloniesResponse] = await Promise.all([
                    fetch(`${API_BASE_URL}/status`),
                    fetch(`${API_BASE_URL}/colonies`)
                ]);

                if (!statusResponse.ok || !coloniesResponse.ok) {
                    throw new Error('API请求失败');
                }

                const statusData = await statusResponse.json();
                const coloniesData = await coloniesResponse.json();

                // 更新UI
                updateSummaryStats(statusData.summary);
                updateAlertsPanel(statusData.alerts);
                updatePerformanceInfo(statusData.performance);
                renderColonies(coloniesData.colonies);
                
                lastDataUpdate = new Date();
                setConnectionStatus(true);
                
            } catch (error) {
                console.error('获取数据失败:', error);
                showError('无法获取行星开发数据，请检查API服务器是否运行。');
                setConnectionStatus(false);
            } finally {
                hideLoading();
                refreshBtn.disabled = false;
                refreshBtn.textContent = '🔄 刷新数据';
            }
        }

        // 更新汇总统计
        function updateSummaryStats(summary) {
            document.getElementById('totalColonies').textContent = summary.totalColonies || 0;
            document.getElementById('activeColonies').textContent = summary.activeColonies || 0;
            document.getElementById('totalExtractors').textContent = summary.totalExtractors || 0;
            document.getElementById('totalProduction').textContent = Math.round(summary.totalProductionPerHour || 0);
            document.getElementById('needsAttention').textContent = summary.coloniesNeedingAttention || 0;
            document.getElementById('averageEfficiency').textContent = Math.round(summary.averageEfficiency || 0);
        }

        // 更新警报面板
        function updateAlertsPanel(alerts) {
            const alertsPanel = document.getElementById('alertsPanel');
            const alertsList = document.getElementById('alertsList');
            
            if (alerts && alerts.length > 0) {
                alertsPanel.style.display = 'block';
                alertsList.innerHTML = alerts.map(alert => `
                    <div class="alert-item alert-${alert.level}">
                        <div class="alert-message">
                            <strong>${alert.colony}:</strong> ${alert.message}
                        </div>
                        <div class="alert-time">${formatTime(alert.timestamp)}</div>
                    </div>
                `).join('');
            } else {
                alertsPanel.style.display = 'none';
            }
        }

        // 更新性能信息
        function updatePerformanceInfo(performance) {
            document.getElementById('dataFreshness').textContent = performance.dataFreshness || '-';
            document.getElementById('lastScanTime').textContent = formatTime(performance.lastScanTime) || '-';
            document.getElementById('scanDuration').textContent = performance.scanDuration || '-';
            document.getElementById('memoryReadingStatus').textContent = performance.memoryReadingStatus || '-';
        }

        // 渲染殖民地卡片
        function renderColonies(colonies) {
            const container = document.getElementById('dashboardContent');
            container.innerHTML = '';

            if (!colonies || colonies.length === 0) {
                container.innerHTML = '<div class="error">没有找到殖民地数据</div>';
                return;
            }

            colonies.forEach((colony, index) => {
                const colonyCard = createColonyCard(colony, index);
                container.appendChild(colonyCard);
            });
        }

        // 创建殖民地卡片
        function createColonyCard(colony, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => showColonyDetail(colony.id);
            
            const statusClass = getStatusClass(colony.status);
            const statusText = getStatusText(colony.status);
            
            const powerPercentage = colony.powerUsage ? colony.powerUsage.percentage : 0;
            const cpuPercentage = colony.cpuUsage ? colony.cpuUsage.percentage : 0;
            const storagePercentage = colony.storageUsage ? colony.storageUsage.percentage : 0;

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${colony.planetName}</div>
                    <div class="status-indicator ${statusClass}">${statusText}</div>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <strong>行星类型:</strong> ${colony.planetType}<br>
                    <strong>星系:</strong> ${colony.systemName} (${colony.securityStatus})<br>
                    <strong>指挥中心等级:</strong> ${colony.commandCenterLevel}
                </div>

                <div class="resource-bar">
                    <div class="resource-label">
                        <span>电力使用</span>
                        <span>${colony.powerUsage ? colony.powerUsage.used : 0} / ${colony.powerUsage ? colony.powerUsage.total : 0} MW</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill progress-power" style="width: ${powerPercentage}%"></div>
                    </div>
                </div>

                <div class="resource-bar">
                    <div class="resource-label">
                        <span>CPU使用</span>
                        <span>${colony.cpuUsage ? colony.cpuUsage.used : 0} / ${colony.cpuUsage ? colony.cpuUsage.total : 0} tf</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill progress-cpu" style="width: ${cpuPercentage}%"></div>
                    </div>
                </div>

                ${colony.storageUsage ? `
                <div class="resource-bar">
                    <div class="resource-label">
                        <span>存储使用</span>
                        <span>${colony.storageUsage.used} / ${colony.storageUsage.total} m³</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill progress-storage" style="width: ${storagePercentage}%"></div>
                    </div>
                </div>
                ` : ''}

                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0;">
                    <div style="text-align: center;">
                        <div style="font-size: 1.5em; color: #00d4ff;">${colony.facilitiesCount || 0}</div>
                        <div style="font-size: 0.9em; opacity: 0.8;">设施</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 1.5em; color: #00d4ff;">${colony.activeExtractors || 0}/${colony.extractorsCount || 0}</div>
                        <div style="font-size: 0.9em; opacity: 0.8;">活跃提取器</div>
                    </div>
                </div>

                <div class="extractor-info">
                    <div class="extractor-header">
                        <div class="resource-type">总产量</div>
                        <div class="status-indicator ${colony.totalProduction > 0 ? 'status-active' : 'status-inactive'}">
                            ${colony.totalProduction > 0 ? '生产中' : '停止'}
                        </div>
                    </div>
                    <div class="extraction-rate">
                        ${colony.totalProduction || 0} 单位/小时
                    </div>
                </div>

                ${colony.issues && colony.issues.length > 0 ? `
                <div style="background: rgba(244, 67, 54, 0.2); padding: 10px; border-radius: 8px; margin-top: 10px;">
                    <strong>⚠️ 问题:</strong>
                    <ul style="margin: 5px 0 0 20px;">
                        ${colony.issues.map(issue => `<li>${issue}</li>`).join('')}
                    </ul>
                </div>
                ` : ''}

                <div class="last-update">
                    最后更新: ${formatTime(colony.lastUpdate)}
                </div>
            `;

            return card;
        }

        // 显示殖民地详情
        async function showColonyDetail(colonyId) {
            try {
                const response = await fetch(`${API_BASE_URL}/colony?id=${colonyId}`);
                if (!response.ok) {
                    throw new Error('获取殖民地详情失败');
                }
                
                const colonyDetail = await response.json();
                
                document.getElementById('colonyModalTitle').textContent = `🌍 ${colonyDetail.planetName}`;
                document.getElementById('colonyModalContent').innerHTML = renderColonyDetail(colonyDetail);
                document.getElementById('colonyModal').style.display = 'block';
                
            } catch (error) {
                console.error('获取殖民地详情失败:', error);
                alert('无法获取殖民地详情');
            }
        }

        // 渲染殖民地详情
        function renderColonyDetail(colony) {
            if (!colony.facilities || colony.facilities.length === 0) {
                return '<div class="loading">详细数据加载中...</div>';
            }

            return `
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #00d4ff; margin-bottom: 10px;">🏭 设施详情</h3>
                    <div class="facility-grid">
                        ${colony.facilities.map(facility => `
                            <div class="facility-item">
                                <div class="facility-icon">${getFacilityIcon(facility.type)}</div>
                                <div class="facility-name">${facility.type}</div>
                                <div class="facility-status">${facility.status}</div>
                                ${facility.level ? `<div style="font-size: 0.8em;">等级 ${facility.level}</div>` : ''}
                                ${facility.powerConsumption ? `<div style="font-size: 0.8em;">${facility.powerConsumption} MW</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>

                ${colony.extractionProgram ? `
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #00d4ff; margin-bottom: 10px;">⛏️ 提取程序</h3>
                    <div style="background: rgba(0, 212, 255, 0.1); padding: 15px; border-radius: 10px;">
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
                            <div>
                                <strong>当前周期:</strong> ${colony.extractionProgram.currentCycle}/${colony.extractionProgram.totalCycles}
                            </div>
                            <div>
                                <strong>剩余时间:</strong> ${Math.floor(colony.extractionProgram.timeRemaining / 3600)}小时
                            </div>
                            <div>
                                <strong>开始时间:</strong> ${formatTime(colony.extractionProgram.startTime)}
                            </div>
                            <div>
                                <strong>下次周期:</strong> ${formatTime(colony.extractionProgram.nextCycleTime)}
                            </div>
                        </div>
                    </div>
                </div>
                ` : ''}

                ${colony.links && colony.links.length > 0 ? `
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #00d4ff; margin-bottom: 10px;">🔗 连接</h3>
                    <div style="display: grid; gap: 10px;">
                        ${colony.links.map(link => `
                            <div style="background: rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 8px;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span>${link.from} → ${link.to}</span>
                                    <span class="status-indicator ${link.isActive ? 'status-active' : 'status-inactive'}">
                                        ${link.isActive ? '活跃' : '非活跃'}
                                    </span>
                                </div>
                                <div style="font-size: 0.9em; opacity: 0.8; margin-top: 5px;">
                                    长度: ${link.length}km | 功耗: ${link.powerConsumption}MW | CPU: ${link.cpuConsumption}tf
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}
            `;
        }

        // 显示资源详情模态框
        async function showResourcesModal() {
            try {
                const response = await fetch(`${API_BASE_URL}/resources`);
                if (!response.ok) {
                    throw new Error('获取资源数据失败');
                }
                
                const resourcesData = await response.json();
                
                document.getElementById('resourcesContent').innerHTML = renderResourcesDetail(resourcesData);
                document.getElementById('resourcesModal').style.display = 'block';
                
            } catch (error) {
                console.error('获取资源数据失败:', error);
                alert('无法获取资源数据');
            }
        }

        // 渲染资源详情
        function renderResourcesDetail(data) {
            return `
                <div style="margin-bottom: 20px;">
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px;">
                        <div class="stat-card">
                            <div class="stat-number">${Math.round(data.totalValue || 0).toLocaleString()}</div>
                            <div class="stat-label">总价值 (ISK)</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${Math.round(data.dailyProduction || 0).toLocaleString()}</div>
                            <div class="stat-label">日产量</div>
                        </div>
                    </div>
                </div>

                <div style="display: grid; gap: 15px;">
                    ${data.resources.map(resource => `
                        <div style="background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 10px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h4 style="color: #00d4ff;">${resource.type}</h4>
                                <span class="status-indicator ${resource.currentRate > 0 ? 'status-active' : 'status-inactive'}">
                                    ${resource.currentRate > 0 ? '生产中' : '停止'}
                                </span>
                            </div>
                            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 0.9em;">
                                <div><strong>总提取量:</strong> ${resource.totalExtracted.toLocaleString()}</div>
                                <div><strong>当前速率:</strong> ${resource.currentRate}/小时</div>
                                <div><strong>平均密度:</strong> ${resource.averageDensity}</div>
                                <div><strong>行星数量:</strong> ${resource.planetsWithResource}</div>
                                <div><strong>市场价格:</strong> ${resource.marketValue} ISK</div>
                                <div><strong>日价值:</strong> ${Math.round(resource.currentRate * 24 * resource.marketValue).toLocaleString()} ISK</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 关闭模态框
        function closeResourcesModal() {
            document.getElementById('resourcesModal').style.display = 'none';
        }

        function closeColonyModal() {
            document.getElementById('colonyModal').style.display = 'none';
        }

        // 获取状态样式类
        function getStatusClass(status) {
            switch (status) {
                case 'active': return 'status-active';
                case 'inactive': return 'status-inactive';
                case 'attention': return 'status-attention';
                case 'error': return 'status-error';
                default: return 'status-inactive';
            }
        }

        // 获取状态文本
        function getStatusText(status) {
            switch (status) {
                case 'active': return '正常运行';
                case 'inactive': return '未激活';
                case 'attention': return '需要关注';
                case 'error': return '错误';
                default: return '未知';
            }
        }

        // 获取设施图标
        function getFacilityIcon(facilityType) {
            switch (facilityType) {
                case 'Command Center': return '🏢';
                case 'Extractor': return '⛏️';
                case 'Processor': return '🏭';
                case 'Storage Unit': return '📦';
                case 'Launchpad': return '🚀';
                default: return '🔧';
            }
        }

        // 格式化时间
        function formatTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp);
            return date.toLocaleString('zh-CN');
        }

        // 显示/隐藏加载指示器
        function showLoading() {
            document.getElementById('loadingIndicator').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loadingIndicator').style.display = 'none';
        }

        // 显示错误信息
        function showError(message) {
            const container = document.getElementById('dashboardContent');
            container.innerHTML = `<div class="error">❌ ${message}</div>`;
        }

        // 切换自动刷新
        function toggleAutoRefresh() {
            const btn = document.getElementById('autoRefreshBtn');
            
            if (isAutoRefreshEnabled) {
                clearInterval(autoRefreshInterval);
                isAutoRefreshEnabled = false;
                btn.textContent = '⏱️ 自动刷新';
                btn.style.background = 'linear-gradient(45deg, #00d4ff, #0099cc)';
            } else {
                autoRefreshInterval = setInterval(refreshData, 30000); // 每30秒刷新
                isAutoRefreshEnabled = true;
                btn.textContent = '⏹️ 停止自动刷新';
                btn.style.background = 'linear-gradient(45deg, #4CAF50, #45a049)';
            }
        }

        // 导出数据
        async function exportData() {
            try {
                const [statusResponse, coloniesResponse, resourcesResponse] = await Promise.all([
                    fetch(`${API_BASE_URL}/status`),
                    fetch(`${API_BASE_URL}/colonies`),
                    fetch(`${API_BASE_URL}/resources`)
                ]);

                const exportData = {
                    timestamp: new Date().toISOString(),
                    status: await statusResponse.json(),
                    colonies: await coloniesResponse.json(),
                    resources: await resourcesResponse.json()
                };

                const dataStr = JSON.stringify(exportData, null, 2);
                const dataBlob = new Blob([dataStr], {type: 'application/json'});
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `pi_data_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                alert('导出数据失败: ' + error.message);
            }
        }

        // 显示设置
        function showSettings() {
            alert('设置功能开发中...\n\n可配置项目：\n- 刷新间隔\n- 警报阈值\n- 显示选项\n- API服务器地址');
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const resourcesModal = document.getElementById('resourcesModal');
            const colonyModal = document.getElementById('colonyModal');
            
            if (event.target === resourcesModal) {
                resourcesModal.style.display = 'none';
            }
            if (event.target === colonyModal) {
                colonyModal.style.display = 'none';
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializeDashboard);

        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', () => {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
