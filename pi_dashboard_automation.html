<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVE Online 行星开发自动化控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c1445 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00d4ff;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.8;
        }

        .automation-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-idle {
            background: #757575;
            color: white;
        }

        .status-executing {
            background: #4CAF50;
            color: white;
            animation: pulse 2s infinite;
        }

        .status-failed {
            background: #F44336;
            color: white;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .automation-controls {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .controls-header {
            font-size: 1.4em;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-card h3 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 5px;
            font-size: 0.9em;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00d4ff, #0099cc);
        }

        .btn-success {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }

        .btn-warning {
            background: linear-gradient(45deg, #FF9800, #f57c00);
        }

        .btn-danger {
            background: linear-gradient(45deg, #F44336, #d32f2f);
        }

        .btn-large {
            padding: 15px 30px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #00d4ff;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.9em;
        }

        .form-control:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 5px rgba(0, 212, 255, 0.3);
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .checkbox-item input[type="checkbox"] {
            margin: 0;
        }

        .task-monitor {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .task-list {
            display: grid;
            gap: 15px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid;
            transition: all 0.3s ease;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .task-idle {
            border-left-color: #757575;
        }

        .task-executing {
            border-left-color: #4CAF50;
            animation: pulse-border 2s infinite;
        }

        .task-completed {
            border-left-color: #2196F3;
        }

        .task-failed {
            border-left-color: #F44336;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-title {
            font-weight: bold;
            color: #00d4ff;
        }

        .task-status {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .task-details {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .safety-panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .safety-check {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .safety-safe {
            border-left: 4px solid #4CAF50;
        }

        .safety-warning {
            border-left: 4px solid #FF9800;
        }

        .safety-danger {
            border-left: 4px solid #F44336;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            margin: 5% auto;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #00d4ff;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }

        .log-info {
            color: #00d4ff;
        }

        .log-success {
            color: #4CAF50;
        }

        .log-warning {
            color: #FF9800;
        }

        .log-error {
            color: #F44336;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @keyframes pulse-border {
            0% { border-left-color: #4CAF50; }
            50% { border-left-color: #8BC34A; }
            100% { border-left-color: #4CAF50; }
        }

        @media (max-width: 768px) {
            .control-section {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .header h1 {
                font-size: 2em;
            }

            .automation-status {
                position: static;
                margin-top: 10px;
                display: inline-block;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 EVE Online 行星开发自动化控制台</h1>
        <p>一键重新采集 | 自动收取资源 | 智能优化管理</p>
        <div id="automationStatus" class="automation-status status-idle">🔄 待机中</div>
    </div>

    <div class="container">
        <!-- 自动化控制面板 -->
        <div class="automation-controls">
            <div class="controls-header">
                🎛️ 自动化控制面板
            </div>
            
            <div class="control-section">
                <!-- 提取器重启控制 -->
                <div class="control-card">
                    <h3>⛏️ 一键重新采集</h3>
                    <div class="form-group">
                        <label>目标资源类型</label>
                        <select class="form-control" id="targetResourceType">
                            <option value="Base Metals">基础金属</option>
                            <option value="Heavy Metals">重金属</option>
                            <option value="Aqueous Liquids">水性液体</option>
                            <option value="Carbon Compounds">碳化合物</option>
                            <option value="Noble Metals">贵金属</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>搜索半径 (公里)</label>
                        <input type="number" class="form-control" id="searchRadius" value="10" min="1" max="50">
                    </div>
                    <div class="form-group">
                        <label>最小密度要求</label>
                        <input type="number" class="form-control" id="minDensity" value="0.8" min="0.1" max="1.0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>采集周期 (小时)</label>
                        <input type="number" class="form-control" id="cycleDuration" value="24" min="1" max="168">
                    </div>
                    <button class="btn btn-success btn-large" onclick="startExtractorRestart()">
                        🚀 启动重新采集
                    </button>
                </div>

                <!-- 资源收取控制 -->
                <div class="control-card">
                    <h3>🚛 自动收取资源</h3>
                    <div class="form-group">
                        <label>角色名称</label>
                        <input type="text" class="form-control" id="characterName" value="TestPilot">
                    </div>
                    <div class="form-group">
                        <label>货舱保留空间 (%)</label>
                        <input type="number" class="form-control" id="cargoReserve" value="10" min="0" max="50">
                    </div>
                    <div class="form-group">
                        <label>最大旅行时间 (分钟)</label>
                        <input type="number" class="form-control" id="maxTravelTime" value="60" min="10" max="300">
                    </div>
                    <div class="form-group">
                        <label>目标行星</label>
                        <div class="checkbox-group" id="planetCheckboxes">
                            <!-- 动态生成 -->
                        </div>
                    </div>
                    <button class="btn btn-primary btn-large" onclick="startResourceCollection()">
                        🛸 启动自动收取
                    </button>
                </div>

                <!-- 紧急控制 -->
                <div class="control-card">
                    <h3>🚨 紧急控制</h3>
                    <p style="margin-bottom: 15px; opacity: 0.8;">
                        紧急情况下可以立即停止所有自动化操作
                    </p>
                    <button class="btn btn-danger btn-large" onclick="emergencyStop()">
                        ⛔ 紧急停止
                    </button>
                    <button class="btn btn-warning" onclick="pauseAllTasks()">
                        ⏸️ 暂停所有任务
                    </button>
                    <button class="btn btn-success" onclick="resumeAllTasks()">
                        ▶️ 恢复所有任务
                    </button>
                </div>
            </div>
        </div>

        <!-- 安全检查面板 -->
        <div class="safety-panel">
            <div class="controls-header">
                🛡️ 安全状态检查
            </div>
            <div id="safetyChecks">
                <!-- 动态生成安全检查项 -->
            </div>
            <button class="btn btn-primary" onclick="runSafetyCheck()">
                🔍 执行安全检查
            </button>
        </div>

        <!-- 统计信息 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalActions">0</div>
                <div class="stat-label">总执行次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="successfulActions">0</div>
                <div class="stat-label">成功次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalValue">0</div>
                <div class="stat-label">总收集价值 (ISK)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="extractorsOptimized">0</div>
                <div class="stat-label">优化提取器</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="averageImprovement">0</div>
                <div class="stat-label">平均改善率 (%)</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeTasks">0</div>
                <div class="stat-label">活跃任务</div>
            </div>
        </div>

        <!-- 任务监控 -->
        <div class="task-monitor">
            <div class="controls-header">
                📋 任务监控
                <button class="btn btn-primary" onclick="refreshTasks()">🔄 刷新</button>
            </div>
            <div id="taskList" class="task-list">
                <!-- 动态生成任务列表 -->
            </div>
        </div>
    </div>

    <!-- 任务详情模态框 -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeTaskModal()">&times;</span>
            <h2 id="taskModalTitle" style="color: #00d4ff; margin-bottom: 20px;"></h2>
            <div id="taskModalContent"></div>
        </div>
    </div>

    <!-- 日志查看模态框 -->
    <div id="logModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeLogModal()">&times;</span>
            <h2 style="color: #00d4ff; margin-bottom: 20px;">📋 任务日志</h2>
            <div id="logContent" class="log-container"></div>
        </div>
    </div>

    <script>
        // API配置
        const AUTOMATION_API_BASE = 'http://localhost:12001/api/automation';
        
        // 全局状态
        let currentTasks = {};
        let planetConfig = [];
        let refreshInterval = null;

        // 初始化页面
        async function initializePage() {
            await loadPlanetConfig();
            await refreshStats();
            await refreshTasks();
            await runSafetyCheck();
            
            // 启动定时刷新
            refreshInterval = setInterval(() => {
                refreshTasks();
                refreshStats();
            }, 5000);
        }

        // 加载行星配置
        async function loadPlanetConfig() {
            try {
                const response = await fetch(`${AUTOMATION_API_BASE}/config/planets`);
                const data = await response.json();
                planetConfig = data.available_planets;
                renderPlanetCheckboxes();
            } catch (error) {
                console.error('加载行星配置失败:', error);
            }
        }

        // 渲染行星复选框
        function renderPlanetCheckboxes() {
            const container = document.getElementById('planetCheckboxes');
            container.innerHTML = '';
            
            planetConfig.forEach(planet => {
                const checkboxItem = document.createElement('div');
                checkboxItem.className = 'checkbox-item';
                checkboxItem.innerHTML = `
                    <input type="checkbox" id="planet_${planet.planet_id}" 
                           ${planet.enabled ? 'checked' : ''} 
                           onchange="updatePlanetConfig('${planet.planet_id}', this.checked)">
                    <label for="planet_${planet.planet_id}">${planet.planet_name}</label>
                `;
                container.appendChild(checkboxItem);
            });
        }

        // 更新行星配置
        async function updatePlanetConfig(planetId, enabled) {
            try {
                const updatedPlanets = planetConfig.map(planet => ({
                    ...planet,
                    enabled: planet.planet_id === planetId ? enabled : planet.enabled
                }));
                
                const response = await fetch(`${AUTOMATION_API_BASE}/config/planets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ planets: updatedPlanets })
                });
                
                if (response.ok) {
                    planetConfig = updatedPlanets;
                    showNotification('行星配置已更新', 'success');
                }
            } catch (error) {
                console.error('更新行星配置失败:', error);
                showNotification('更新行星配置失败', 'error');
            }
        }

        // 启动提取器重启
        async function startExtractorRestart() {
            const config = {
                colony_id: 'colony_1',
                extractor_id: 'extractor_1',
                target_resource_type: document.getElementById('targetResourceType').value,
                search_radius: parseFloat(document.getElementById('searchRadius').value),
                min_resource_density: parseFloat(document.getElementById('minDensity').value),
                cycle_duration: parseInt(document.getElementById('cycleDuration').value),
                auto_optimize: true
            };

            try {
                const response = await fetch(`${AUTOMATION_API_BASE}/extractor/restart`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification(`提取器重启任务已启动 (ID: ${result.task_id})`, 'success');
                    updateAutomationStatus('executing');
                    refreshTasks();
                } else {
                    showNotification(`启动失败: ${result.error}`, 'error');
                }
            } catch (error) {
                console.error('启动提取器重启失败:', error);
                showNotification('启动提取器重启失败', 'error');
            }
        }

        // 启动资源收取
        async function startResourceCollection() {
            const enabledPlanets = planetConfig.filter(planet => planet.enabled);
            
            if (enabledPlanets.length === 0) {
                showNotification('请至少选择一个目标行星', 'warning');
                return;
            }

            const config = {
                character_name: document.getElementById('characterName').value,
                target_planets: enabledPlanets,
                cargo_hold_reserve: parseFloat(document.getElementById('cargoReserve').value),
                max_travel_time: parseInt(document.getElementById('maxTravelTime').value)
            };

            try {
                const response = await fetch(`${AUTOMATION_API_BASE}/collection/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification(`资源收取任务已启动 (ID: ${result.task_id})`, 'success');
                    showNotification(`将访问行星: ${result.target_planets.join(', ')}`, 'info');
                    updateAutomationStatus('executing');
                    refreshTasks();
                } else {
                    showNotification(`启动失败: ${result.error}`, 'error');
                }
            } catch (error) {
                console.error('启动资源收取失败:', error);
                showNotification('启动资源收取失败', 'error');
            }
        }

        // 紧急停止
        async function emergencyStop() {
            if (!confirm('确定要紧急停止所有自动化操作吗？')) {
                return;
            }

            try {
                const response = await fetch(`${AUTOMATION_API_BASE}/emergency/stop`, {
                    method: 'POST'
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification(result.message, 'warning');
                    updateAutomationStatus('idle');
                    refreshTasks();
                } else {
                    showNotification('紧急停止失败', 'error');
                }
            } catch (error) {
                console.error('紧急停止失败:', error);
                showNotification('紧急停止失败', 'error');
            }
        }

        // 暂停所有任务
        async function pauseAllTasks() {
            showNotification('暂停功能开发中...', 'info');
        }

        // 恢复所有任务
        async function resumeAllTasks() {
            showNotification('恢复功能开发中...', 'info');
        }

        // 执行安全检查
        async function runSafetyCheck() {
            try {
                const response = await fetch(`${AUTOMATION_API_BASE}/safety/check`);
                const safetyStatus = await response.json();
                renderSafetyChecks(safetyStatus);
            } catch (error) {
                console.error('安全检查失败:', error);
                showNotification('安全检查失败', 'error');
            }
        }

        // 渲染安全检查结果
        function renderSafetyChecks(safetyStatus) {
            const container = document.getElementById('safetyChecks');
            container.innerHTML = '';

            Object.entries(safetyStatus.checks).forEach(([key, check]) => {
                const checkDiv = document.createElement('div');
                checkDiv.className = `safety-check ${check.safe ? 'safety-safe' : 'safety-danger'}`;
                checkDiv.innerHTML = `
                    <span>${check.safe ? '✅' : '❌'} ${check.message}</span>
                    <span>${check.safe ? '安全' : '警告'}</span>
                `;
                container.appendChild(checkDiv);
            });

            if (safetyStatus.warnings && safetyStatus.warnings.length > 0) {
                safetyStatus.warnings.forEach(warning => {
                    const warningDiv = document.createElement('div');
                    warningDiv.className = 'safety-check safety-warning';
                    warningDiv.innerHTML = `
                        <span>⚠️ ${warning}</span>
                        <span>注意</span>
                    `;
                    container.appendChild(warningDiv);
                });
            }
        }

        // 刷新统计信息
        async function refreshStats() {
            try {
                const response = await fetch(`${AUTOMATION_API_BASE}/stats`);
                const stats = await response.json();
                
                document.getElementById('totalActions').textContent = stats.total_actions_executed || 0;
                document.getElementById('successfulActions').textContent = stats.successful_actions || 0;
                document.getElementById('totalValue').textContent = Math.round(stats.total_value_collected || 0).toLocaleString();
                document.getElementById('extractorsOptimized').textContent = stats.extractors_optimized || 0;
                document.getElementById('averageImprovement').textContent = Math.round(stats.average_improvement_percentage || 0);
                
                // 计算活跃任务数
                const activeTasks = Object.values(currentTasks).filter(task => 
                    task.status === 'executing' || task.status === 'planning'
                ).length;
                document.getElementById('activeTasks').textContent = activeTasks;
                
            } catch (error) {
                console.error('刷新统计失败:', error);
            }
        }

        // 刷新任务列表
        async function refreshTasks() {
            try {
                const response = await fetch(`${AUTOMATION_API_BASE}/tasks`);
                const data = await response.json();
                
                // 更新当前任务状态
                for (const task of data.tasks) {
                    currentTasks[task.task_id] = task;
                }
                
                renderTaskList();
                updateAutomationStatusFromTasks();
                
            } catch (error) {
                console.error('刷新任务失败:', error);
            }
        }

        // 渲染任务列表
        function renderTaskList() {
            const container = document.getElementById('taskList');
            const tasks = Object.values(currentTasks).sort((a, b) => 
                new Date(b.start_time) - new Date(a.start_time)
            );
            
            if (tasks.length === 0) {
                container.innerHTML = '<div style="text-align: center; opacity: 0.7; padding: 40px;">暂无任务</div>';
                return;
            }
            
            container.innerHTML = tasks.map(task => `
                <div class="task-item task-${task.status}" onclick="showTaskDetails('${task.task_id}')">
                    <div class="task-header">
                        <div class="task-title">
                            ${getActionTypeText(task.action_type)} (${task.task_id.substring(0, 8)})
                        </div>
                        <div class="task-status ${getStatusClass(task.status)}">
                            ${getStatusText(task.status)}
                        </div>
                    </div>
                    
                    ${task.status === 'executing' ? `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${task.progress || 0}%"></div>
                        </div>
                        <div class="task-details">
                            当前步骤: ${getCurrentStepText(task.current_step)} (${Math.round(task.progress || 0)}%)
                        </div>
                    ` : ''}
                    
                    <div class="task-details">
                        开始时间: ${formatTime(task.start_time)}
                        ${task.total_value ? ` | 收集价值: ${Math.round(task.total_value).toLocaleString()} ISK` : ''}
                        ${task.items_collected ? ` | 收集物品: ${task.items_collected} 种` : ''}
                    </div>
                    
                    <div style="margin-top: 10px;">
                        <button class="btn btn-primary" onclick="event.stopPropagation(); showTaskLogs('${task.task_id}')">
                            📋 查看日志
                        </button>
                        ${task.status === 'executing' || task.status === 'planning' ? `
                            <button class="btn btn-danger" onclick="event.stopPropagation(); cancelTask('${task.task_id}')">
                                ❌ 取消任务
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 显示任务详情
        async function showTaskDetails(taskId) {
            try {
                const response = await fetch(`${AUTOMATION_API_BASE}/task/${taskId}`);
                const task = await response.json();
                
                document.getElementById('taskModalTitle').textContent = 
                    `${getActionTypeText(task.action_type)} - ${task.task_id.substring(0, 8)}`;
                
                let content = `
                    <div style="margin-bottom: 20px;">
                        <h3 style="color: #00d4ff;">基本信息</h3>
                        <p><strong>任务ID:</strong> ${task.task_id}</p>
                        <p><strong>操作类型:</strong> ${getActionTypeText(task.action_type)}</p>
                        <p><strong>状态:</strong> ${getStatusText(task.status)}</p>
                        <p><strong>进度:</strong> ${Math.round(task.progress || 0)}%</p>
                        <p><strong>开始时间:</strong> ${formatTime(task.start_time)}</p>
                        ${task.estimated_completion ? `<p><strong>预计完成:</strong> ${formatTime(task.estimated_completion)}</p>` : ''}
                    </div>
                `;
                
                if (task.current_step) {
                    content += `
                        <div style="margin-bottom: 20px;">
                            <h3 style="color: #00d4ff;">当前步骤</h3>
                            <p>${getCurrentStepText(task.current_step)}</p>
                        </div>
                    `;
                }
                
                if (task.result) {
                    content += `
                        <div style="margin-bottom: 20px;">
                            <h3 style="color: #00d4ff;">执行结果</h3>
                            <p><strong>成功:</strong> ${task.result.success ? '是' : '否'}</p>
                            <p><strong>总价值:</strong> ${Math.round(task.result.total_value || 0).toLocaleString()} ISK</p>
                            <p><strong>收集物品:</strong> ${task.result.items_collected ? task.result.items_collected.length : 0} 种</p>
                            <p><strong>优化提取器:</strong> ${task.result.extractors_restarted ? task.result.extractors_restarted.length : 0} 个</p>
                        </div>
                    `;
                }
                
                if (task.error_message) {
                    content += `
                        <div style="margin-bottom: 20px;">
                            <h3 style="color: #F44336;">错误信息</h3>
                            <p style="color: #F44336;">${task.error_message}</p>
                        </div>
                    `;
                }
                
                document.getElementById('taskModalContent').innerHTML = content;
                document.getElementById('taskModal').style.display = 'block';
                
            } catch (error) {
                console.error('获取任务详情失败:', error);
                showNotification('获取任务详情失败', 'error');
            }
        }

        // 显示任务日志
        async function showTaskLogs(taskId) {
            try {
                const response = await fetch(`${AUTOMATION_API_BASE}/logs/${taskId}`);
                const data = await response.json();
                
                const logContainer = document.getElementById('logContent');
                logContainer.innerHTML = data.logs.map(log => `
                    <div class="log-entry log-${log.level.toLowerCase()}">
                        [${formatTime(log.timestamp)}] ${log.level}: ${log.message}
                    </div>
                `).join('');
                
                document.getElementById('logModal').style.display = 'block';
                
            } catch (error) {
                console.error('获取任务日志失败:', error);
                showNotification('获取任务日志失败', 'error');
            }
        }

        // 取消任务
        async function cancelTask(taskId) {
            if (!confirm('确定要取消这个任务吗？')) {
                return;
            }

            try {
                const response = await fetch(`${AUTOMATION_API_BASE}/task/${taskId}/cancel`, {
                    method: 'POST'
                });

                const result = await response.json();
                
                if (result.success) {
                    showNotification('任务已取消', 'warning');
                    refreshTasks();
                } else {
                    showNotification(`取消失败: ${result.error}`, 'error');
                }
            } catch (error) {
                console.error('取消任务失败:', error);
                showNotification('取消任务失败', 'error');
            }
        }

        // 更新自动化状态
        function updateAutomationStatus(status) {
            const statusElement = document.getElementById('automationStatus');
            statusElement.className = `automation-status status-${status}`;
            
            switch (status) {
                case 'idle':
                    statusElement.textContent = '🔄 待机中';
                    break;
                case 'executing':
                    statusElement.textContent = '⚡ 执行中';
                    break;
                case 'failed':
                    statusElement.textContent = '❌ 错误';
                    break;
                default:
                    statusElement.textContent = '🔄 待机中';
            }
        }

        // 从任务状态更新自动化状态
        function updateAutomationStatusFromTasks() {
            const tasks = Object.values(currentTasks);
            const hasExecuting = tasks.some(task => task.status === 'executing' || task.status === 'planning');
            const hasFailed = tasks.some(task => task.status === 'failed');
            
            if (hasExecuting) {
                updateAutomationStatus('executing');
            } else if (hasFailed) {
                updateAutomationStatus('failed');
            } else {
                updateAutomationStatus('idle');
            }
        }

        // 辅助函数
        function getActionTypeText(actionType) {
            switch (actionType) {
                case 'extractor_restart': return '⛏️ 提取器重启';
                case 'resource_collection': return '🚛 资源收取';
                default: return actionType;
            }
        }

        function getStatusText(status) {
            switch (status) {
                case 'idle': return '待机';
                case 'planning': return '规划中';
                case 'executing': return '执行中';
                case 'paused': return '已暂停';
                case 'completed': return '已完成';
                case 'failed': return '失败';
                default: return status;
            }
        }

        function getStatusClass(status) {
            switch (status) {
                case 'completed': return 'btn-success';
                case 'executing': case 'planning': return 'btn-primary';
                case 'failed': return 'btn-danger';
                case 'paused': return 'btn-warning';
                default: return 'btn-secondary';
            }
        }

        function getCurrentStepText(step) {
            const stepTexts = {
                'undocking_from_station': '正在离开空间站',
                'navigating_to_system': '正在跳跃到目标星系',
                'warping_to_planet': '正在跃迁到行星',
                'approaching_customs_office': '正在接近海关办公室',
                'accessing_customs_office': '正在访问海关办公室',
                'transferring_cargo': '正在转移货物',
                'returning_to_station': '正在返回空间站',
                'docking_at_station': '正在停靠空间站',
                'opening_planetary_interface': '正在打开行星界面',
                'stopping_current_extraction': '正在停止当前采集',
                'analyzing_resource_distribution': '正在分析资源分布',
                'selecting_optimal_location': '正在选择最佳位置',
                'configuring_new_extraction': '正在配置新的采集程序',
                'starting_extraction_cycle': '正在启动采集周期'
            };
            return stepTexts[step] || step;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '-';
            return new Date(timestamp).toLocaleString('zh-CN');
        }

        function showNotification(message, type = 'info') {
            // 简单的通知实现
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 5px;
                color: white;
                font-weight: bold;
                z-index: 10000;
                max-width: 300px;
                word-wrap: break-word;
            `;
            
            switch (type) {
                case 'success':
                    notification.style.background = '#4CAF50';
                    break;
                case 'error':
                    notification.style.background = '#F44336';
                    break;
                case 'warning':
                    notification.style.background = '#FF9800';
                    break;
                default:
                    notification.style.background = '#2196F3';
            }
            
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                document.body.removeChild(notification);
            }, 5000);
        }

        // 模态框控制
        function closeTaskModal() {
            document.getElementById('taskModal').style.display = 'none';
        }

        function closeLogModal() {
            document.getElementById('logModal').style.display = 'none';
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const taskModal = document.getElementById('taskModal');
            const logModal = document.getElementById('logModal');
            
            if (event.target === taskModal) {
                taskModal.style.display = 'none';
            }
            if (event.target === logModal) {
                logModal.style.display = 'none';
            }
        }

        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', () => {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
